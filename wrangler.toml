name = "home"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
workers_dev = false
main = ".svelte-kit/cloudflare/_worker.js"

[assets]
directory = ".svelte-kit/cloudflare"
binding = "ASSETS"

[[routes]]
pattern = "about.reesuke.com"
zone_name = "reesuke.com"
custom_domain = true
enabled = true
previews_enabled = false

[vars]
PUBLIC_WP_URL = "https://blog.ree-jp.net"

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true
